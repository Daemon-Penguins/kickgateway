name: 🚀 Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker/**'
      - 'deploy/docker-compose.prod.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub namespace is read from a repo variable so forks can substitute
  # their own. Set `DOCKERHUB_NAMESPACE` under repo Variables (not Secrets —
  # it's not sensitive but it does identify the owner).
  API_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-api
  WORKER_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-worker
  REALTIME_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-realtime
  CLIPS_FETCHER_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-clips-fetcher
  MCP_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-mcp
  TRANSCRIBER_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-transcriber
  SUBTITLES_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-subtitles
  TRANSLATOR_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-translator
  TWITCH_LISTENER_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-twitch-listener
  TWITCH_CAPTURE_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-twitch-capture

jobs:
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Worker/Dockerfile
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Build & push Realtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Realtime/Dockerfile
          push: true
          tags: |
            ${{ env.REALTIME_IMAGE }}:latest
            ${{ env.REALTIME_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,scope=realtime,mode=max

      - name: Build & push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Mcp/Dockerfile
          push: true
          tags: |
            ${{ env.MCP_IMAGE }}:latest
            ${{ env.MCP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

      - name: Build & push Subtitles image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Subtitles/Dockerfile
          push: true
          tags: |
            ${{ env.SUBTITLES_IMAGE }}:latest
            ${{ env.SUBTITLES_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=subtitles
          cache-to: type=gha,scope=subtitles,mode=max

      - name: Build & push Translator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Subscribers.Translator/Dockerfile
          push: true
          tags: |
            ${{ env.TRANSLATOR_IMAGE }}:latest
            ${{ env.TRANSLATOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=translator
          cache-to: type=gha,scope=translator,mode=max

      - name: Build & push Transcriber image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Subscribers.Transcriber/Dockerfile
          push: true
          tags: |
            ${{ env.TRANSCRIBER_IMAGE }}:latest
            ${{ env.TRANSCRIBER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=transcriber
          cache-to: type=gha,scope=transcriber,mode=max

      - name: Build & push Twitch listener image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.TwitchGateway.Listener/Dockerfile
          push: true
          tags: |
            ${{ env.TWITCH_LISTENER_IMAGE }}:latest
            ${{ env.TWITCH_LISTENER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=twitch-listener
          cache-to: type=gha,scope=twitch-listener,mode=max

      - name: Build & push Twitch capture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.TwitchGateway.Capture/Dockerfile
          push: true
          tags: |
            ${{ env.TWITCH_CAPTURE_IMAGE }}:latest
            ${{ env.TWITCH_CAPTURE_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=twitch-capture
          cache-to: type=gha,scope=twitch-capture,mode=max

      - name: Build & push clips-fetcher image
        uses: docker/build-push-action@v6
        with:
          context: docker/clips-fetcher
          file: docker/clips-fetcher/Dockerfile
          push: true
          tags: |
            ${{ env.CLIPS_FETCHER_IMAGE }}:latest
            ${{ env.CLIPS_FETCHER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=clips-fetcher
          cache-to: type=gha,scope=clips-fetcher,mode=max

  deploy:
    name: 🖥️ Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          # Project directory (idempotent)
          $SSH_CMD "sudo mkdir -p /opt/apps/kickgateway && sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} /opt/apps/kickgateway"

          # The production compose file lives in the repo (deploy/docker-compose.prod.yml) and is shipped
          # verbatim; docker compose interpolates its ${VAR}s from the .env written below. (An inline heredoc
          # with ${{ }} inside would count towards GitHub's 21000-character expression limit per step.)

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            deploy/docker-compose.prod.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/apps/kickgateway/docker-compose.yml

          # Compose profiles (comma-separated when several are on). kick-realtime is the one profile that is ON by
          # default (KICK_REALTIME_ENABLED=false turns it off); every Twitch profile is opt-in.
          PROFILES=""
          [ "${{ vars.KICK_REALTIME_ENABLED }}" != "false" ] && PROFILES="kick-realtime"
          [ "${{ vars.TRANSCRIBER_ENABLED }}" = "true" ] && PROFILES="${PROFILES:+$PROFILES,}transcriber"
          [ "${{ vars.SUBTITLES_ENABLED }}" = "true" ] && PROFILES="${PROFILES:+$PROFILES,}subtitles"
          [ "${{ vars.TRANSLATOR_ENABLED }}" = "true" ] && PROFILES="${PROFILES:+$PROFILES,}translator"
          [ "${{ vars.TWITCH_CHAT_ENABLED }}" = "true" ] && PROFILES="${PROFILES:+$PROFILES,}twitch-chat"
          [ "${{ vars.TWITCH_AUDIO_ENABLED }}" = "true" ] && PROFILES="${PROFILES:+$PROFILES,}twitch-audio"
          [ "${{ vars.TWITCH_TRANSCRIBER_ENABLED }}" = "true" ] && PROFILES="${PROFILES:+$PROFILES,}twitch-transcriber"

          # Write .env with secrets
          $SSH_CMD "cat > /opt/apps/kickgateway/.env << 'ENVFILE'
          IMAGE_TAG=${{ github.sha }}
          DOCKERHUB_NAMESPACE=${{ vars.DOCKERHUB_NAMESPACE }}
          DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
          RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_VHOST=${{ secrets.RABBITMQ_VHOST }}
          RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          KICK_WEBHOOK_URL=${{ secrets.KICK_WEBHOOK_URL }}
          SEED_SUPERADMIN_USERNAME=${{ secrets.SEED_SUPERADMIN_USERNAME }}
          PUBLIC_HOST=${{ secrets.PUBLIC_HOST }}
          CLIPS_FETCHER_SECRET=${{ secrets.CLIPS_FETCHER_SECRET }}
          ANALYTICS_API_KEY=${{ secrets.ANALYTICS_API_KEY }}
          REALTIME_VIDEO_ENABLED=${{ vars.REALTIME_VIDEO_ENABLED }}
          KICK_REALTIME_APP_KEY=${{ vars.KICK_REALTIME_APP_KEY }}
          KICK_REALTIME_WS_HOST=${{ vars.KICK_REALTIME_WS_HOST }}
          TWITCH_CLIENT_ID=${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_AUDIO_RENDITION=${{ vars.TWITCH_AUDIO_RENDITION }}
          COMPOSE_PROFILES=$PROFILES
          SUBTITLES_HOST=${{ secrets.SUBTITLES_HOST }}
          SUBTITLES_CHANNELS=${{ vars.SUBTITLES_CHANNELS }}
          SUBTITLES_RELAY_TOKEN=${{ secrets.SUBTITLES_RELAY_TOKEN }}
          SUBTITLES_RELAY_MAX_VIEWERS=${{ vars.SUBTITLES_RELAY_MAX_VIEWERS }}
          REALTIME_VIDEO_MAX_BITRATE_KBPS=${{ vars.REALTIME_VIDEO_MAX_BITRATE_KBPS }}
          TRANSLATOR_API_KEY=${{ secrets.TRANSLATOR_API_KEY }}
          TRANSLATOR_PROVIDER=${{ vars.TRANSLATOR_PROVIDER }}
          TRANSLATOR_MODEL=${{ vars.TRANSLATOR_MODEL }}
          TRANSLATOR_BASE_URL=${{ vars.TRANSLATOR_BASE_URL }}
          TRANSLATOR_FORMALITY=${{ vars.TRANSLATOR_FORMALITY }}
          TRANSLATOR_SOURCE_LANGUAGES=${{ vars.TRANSLATOR_SOURCE_LANGUAGES }}
          TRANSLATOR_TARGET_LANGUAGE=${{ vars.TRANSLATOR_TARGET_LANGUAGE }}
          TRANSLATOR_CHANNELS=${{ vars.TRANSLATOR_CHANNELS }}
          TRANSCRIBER_MODEL=${{ vars.TRANSCRIBER_MODEL }}
          TRANSCRIBER_QUANTIZATION=${{ vars.TRANSCRIBER_QUANTIZATION }}
          TRANSCRIBER_LANGUAGE=${{ vars.TRANSCRIBER_LANGUAGE }}
          TRANSCRIBER_LANGUAGES=${{ vars.TRANSCRIBER_LANGUAGES || 'pl,en,de' }}
          TRANSCRIBER_LANGUAGE_MIN_PROBABILITY=${{ vars.TRANSCRIBER_LANGUAGE_MIN_PROBABILITY }}
          TRANSCRIBER_LANGUAGE_CONFIRM_CHUNKS=${{ vars.TRANSCRIBER_LANGUAGE_CONFIRM_CHUNKS }}
          TRANSCRIBER_THREADS=${{ vars.TRANSCRIBER_THREADS }}
          TRANSCRIBER_WRITE_FILES=${{ vars.TRANSCRIBER_WRITE_FILES }}
          ENVFILE"

          # OpenTelemetry export for every .NET container (docs/MONITORING.md). On the HQ VPS hq-config also
          # injects the endpoint centrally (docker-compose.override.yml -> http://alloy:4317, grpc) and a
          # compose override's `environment` beats this env_file; the secret there is http://alloy:4318 (Alloy's
          # HTTP port, matching the default protocol below) so profile containers that the override has not
          # caught up with yet export too. Elsewhere: one endpoint for all signals (Collector / Alloy) or a
          # metrics-only one (Prometheus' OTLP receiver). Empty = export off (ServiceDefaults and the SDK treat
          # an empty variable as unset). Traces are sampled parent-based, otherwise MassTransit emits a span
          # per chat message into Tempo. service.namespace mirrors what the HQ override sets, so the
          # Prometheus `job` label (namespace/name) is the same either way.
          $SSH_CMD "cat > /opt/apps/kickgateway/otel.env << 'ENVFILE'
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_METRICS_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS=${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_PROTOCOL=${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL || 'http/protobuf' }}
          OTEL_METRIC_EXPORT_INTERVAL=${{ vars.OTEL_METRIC_EXPORT_INTERVAL || '15000' }}
          OTEL_TRACES_SAMPLER=parentbased_traceidratio
          OTEL_TRACES_SAMPLER_ARG=${{ vars.OTEL_TRACES_SAMPLER_ARG || '0.1' }}
          OTEL_RESOURCE_ATTRIBUTES=service.namespace=kickgateway,deployment.environment=production
          ENVFILE"

          # Ensure shared external networks exist (idempotent).
          $SSH_CMD "docker network create traefik-public 2>/dev/null || true"
          $SSH_CMD "docker network create db-internal 2>/dev/null || true"

          # Docker login on server (for private images, if Docker Hub repo is private)
          $SSH_CMD "docker login -u ${{ secrets.DOCKERHUB_USER }} -p ${{ secrets.DOCKERHUB_TOKEN }}"

          # Pull and deploy
          $SSH_CMD "cd /opt/apps/kickgateway && docker compose pull && docker compose up -d --remove-orphans"

          # `up` ignores services of inactive profiles even if their container is running, so turn the
          # transcriber off explicitly when TRANSCRIBER_ENABLED is not 'true'.
          if [ "${{ vars.TRANSCRIBER_ENABLED }}" != "true" ]; then
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile transcriber rm -s -f transcriber >/dev/null 2>&1 || true"
          fi
          if [ "${{ vars.SUBTITLES_ENABLED }}" != "true" ]; then
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile subtitles rm -s -f subtitles >/dev/null 2>&1 || true"
          fi
          if [ "${{ vars.TRANSLATOR_ENABLED }}" != "true" ]; then
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile translator rm -s -f translator >/dev/null 2>&1 || true"
          fi
          if [ "${{ vars.KICK_REALTIME_ENABLED }}" = "false" ]; then
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile kick-realtime rm -s -f realtime >/dev/null 2>&1 || true"
          fi
          if [ "${{ vars.TWITCH_CHAT_ENABLED }}" != "true" ]; then
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile twitch-chat rm -s -f twitch-listener >/dev/null 2>&1 || true"
          fi
          if [ "${{ vars.TWITCH_AUDIO_ENABLED }}" != "true" ]; then
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile twitch-audio rm -s -f twitch-capture >/dev/null 2>&1 || true"
          fi
          if [ "${{ vars.TWITCH_TRANSCRIBER_ENABLED }}" != "true" ]; then
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile twitch-transcriber rm -s -f transcriber-twitch >/dev/null 2>&1 || true"
          fi

          # Verify
          $SSH_CMD "cd /opt/apps/kickgateway && docker compose ps"

      - name: Health check
        env:
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
        run: |
          sleep 20
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          echo "── docker compose ps ──"
          $SSH_CMD "cd /opt/apps/kickgateway && docker compose ps"

          echo "── unhealthy/restarting containers (any?) ──"
          UNHEALTHY=$($SSH_CMD "cd /opt/apps/kickgateway && docker compose ps --format '{{.Name}} {{.Status}}' | grep -E 'unhealthy|Restarting|Exited' || true")
          if [ -n "$UNHEALTHY" ]; then
            echo "❌ Unhealthy containers found:"
            echo "$UNHEALTHY"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile transcriber logs --tail 30 api worker transcriber 2>/dev/null || docker compose logs --tail 30 api worker"
            exit 1
          fi

          echo "── HTTPS smoke (admin root) ──"
          STATUS=$(curl -ks -o /dev/null -w "%{http_code}" "https://${PUBLIC_HOST}/")
          echo "https://${PUBLIC_HOST}/ -> HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "❌ Admin root did not return 200/302, dumping api logs:"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose logs --tail 30 api"
            exit 1
          fi

          echo "── Health endpoint ──"
          HEALTH=$(curl -ks -o /dev/null -w "%{http_code}" "https://${PUBLIC_HOST}/health")
          echo "https://${PUBLIC_HOST}/health -> HTTP $HEALTH"
          # /health only exposed in Development per service defaults — accept 200 or 404.
          if [ "$HEALTH" != "200" ] && [ "$HEALTH" != "404" ]; then
            echo "⚠️ Unexpected /health status — investigate"
          fi

          echo "── Admin UI ──"
          ADMIN=$(curl -ks -o /dev/null -w "%{http_code}" "https://${PUBLIC_HOST}/admin")
          echo "https://${PUBLIC_HOST}/admin -> HTTP $ADMIN"
          if [ "$ADMIN" != "200" ]; then
            echo "❌ /admin did not return 200"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose logs --tail 30 api"
            exit 1
          fi

          echo "── Webhook endpoint (expects 400/401 without proper signature, NOT 5xx) ──"
          WH=$(curl -ks -o /dev/null -w "%{http_code}" -X POST "https://${PUBLIC_HOST}/api/webhooks/kick" -H "Content-Type: application/json" -d '{}')
          echo "POST /api/webhooks/kick (empty) -> HTTP $WH"
          if [ "$WH" = "500" ] || [ "$WH" = "502" ] || [ "$WH" = "503" ] || [ "$WH" = "504" ]; then
            echo "❌ Webhook endpoint returning 5xx — pipeline crash"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose logs --tail 30 api"
            exit 1
          fi

          echo "── OBS clips API (unknown channel → expect 404, NOT 5xx) ──"
          OBS=$(curl -ks -o /dev/null -w "%{http_code}" "https://${PUBLIC_HOST}/api/obs/clips/__deploy_probe__")
          echo "GET /api/obs/clips/__deploy_probe__ -> HTTP $OBS"
          if [ "$OBS" = "500" ] || [ "$OBS" = "502" ] || [ "$OBS" = "503" ] || [ "$OBS" = "504" ]; then
            echo "❌ OBS clips endpoint returning 5xx"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose logs --tail 30 api clips-fetcher"
            exit 1
          fi

          echo "── MCP server (OAuth discovery must reach the mcp container; /mcp must challenge, not 5xx) ──"
          PRM=$(curl -ks -o /dev/null -w "%{http_code}" "https://${PUBLIC_HOST}/.well-known/oauth-protected-resource")
          echo "GET /.well-known/oauth-protected-resource -> HTTP $PRM"
          if [ "$PRM" != "200" ]; then
            # 404 = OAuth inactive (no ANALYTICS_API_KEY) or the Traefik rule does not route the well-known paths.
            echo "⚠️ OAuth resource metadata not served — OAuth clients (ChatGPT, Claude.ai) cannot connect"
            if [ "$PRM" = "500" ] || [ "$PRM" = "502" ] || [ "$PRM" = "503" ] || [ "$PRM" = "504" ]; then
              echo "❌ mcp container returning 5xx"
              $SSH_CMD "cd /opt/apps/kickgateway && docker compose logs --tail 30 mcp"
              exit 1
            fi
          fi
          MCP=$(curl -ks -o /dev/null -w "%{http_code}" -X POST "https://${PUBLIC_HOST}/mcp" -H "Content-Type: application/json" -d '{}')
          echo "POST /mcp (no auth) -> HTTP $MCP"
          if [ "$MCP" != "401" ]; then
            echo "❌ /mcp did not answer 401 to an unauthenticated request"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose logs --tail 30 mcp"
            exit 1
          fi

          echo "✅ All smoke tests passed"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
