name: 🚀 Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub namespace is read from a repo variable so forks can substitute
  # their own. Set `DOCKERHUB_NAMESPACE` under repo Variables (not Secrets —
  # it's not sensitive but it does identify the owner).
  API_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-api
  WORKER_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-worker
  REALTIME_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-realtime
  CLIPS_FETCHER_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-clips-fetcher
  MCP_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-mcp
  TRANSCRIBER_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-transcriber
  SUBTITLES_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-subtitles
  TRANSLATOR_IMAGE: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-translator

jobs:
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build & push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Worker/Dockerfile
          push: true
          tags: |
            ${{ env.WORKER_IMAGE }}:latest
            ${{ env.WORKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      - name: Build & push Realtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Realtime/Dockerfile
          push: true
          tags: |
            ${{ env.REALTIME_IMAGE }}:latest
            ${{ env.REALTIME_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=realtime
          cache-to: type=gha,scope=realtime,mode=max

      - name: Build & push MCP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Mcp/Dockerfile
          push: true
          tags: |
            ${{ env.MCP_IMAGE }}:latest
            ${{ env.MCP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

      - name: Build & push Subtitles image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Subtitles/Dockerfile
          push: true
          tags: |
            ${{ env.SUBTITLES_IMAGE }}:latest
            ${{ env.SUBTITLES_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=subtitles
          cache-to: type=gha,scope=subtitles,mode=max

      - name: Build & push Translator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Subscribers.Translator/Dockerfile
          push: true
          tags: |
            ${{ env.TRANSLATOR_IMAGE }}:latest
            ${{ env.TRANSLATOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=translator
          cache-to: type=gha,scope=translator,mode=max

      - name: Build & push Transcriber image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TailoredApps.KickGateway.Subscribers.Transcriber/Dockerfile
          push: true
          tags: |
            ${{ env.TRANSCRIBER_IMAGE }}:latest
            ${{ env.TRANSCRIBER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=transcriber
          cache-to: type=gha,scope=transcriber,mode=max

      - name: Build & push clips-fetcher image
        uses: docker/build-push-action@v6
        with:
          context: docker/clips-fetcher
          file: docker/clips-fetcher/Dockerfile
          push: true
          tags: |
            ${{ env.CLIPS_FETCHER_IMAGE }}:latest
            ${{ env.CLIPS_FETCHER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=clips-fetcher
          cache-to: type=gha,scope=clips-fetcher,mode=max

  deploy:
    name: 🖥️ Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to server
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          # Project directory (idempotent)
          $SSH_CMD "sudo mkdir -p /opt/apps/kickgateway && sudo chown -R ${{ secrets.DEPLOY_USER }}:${{ secrets.DEPLOY_USER }} /opt/apps/kickgateway"

          # Generate production compose file
          cat > /tmp/docker-compose.prod.yml << 'COMPOSE'
          networks:
            default:
              # kickgateway internal — api ↔ worker (service discovery)
            traefik-public:
              external: true
            db-internal:
              external: true

          services:
            api:
              image: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-api:${IMAGE_TAG:-latest}
              restart: unless-stopped
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - ConnectionStrings__KickGateway=${DB_CONNECTION_STRING:-}
                - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
                - RabbitMq__Port=${RABBITMQ_PORT:-5672}
                - RabbitMq__VirtualHost=${RABBITMQ_VHOST:-/}
                - RabbitMq__Username=${RABBITMQ_USERNAME:-}
                - RabbitMq__Password=${RABBITMQ_PASSWORD:-}
                - Kick__AuthBaseUrl=https://id.kick.com
                - Kick__ApiBaseUrl=https://api.kick.com
                - Kick__WebhookUrl=${KICK_WEBHOOK_URL:-}
                - Kick__PublicKeyCacheMinutes=60
                - Kick__ClipsFetcherUrl=http://clips-fetcher:8080
                - Kick__ClipsFetcherSecret=${CLIPS_FETCHER_SECRET:-}
                - Seed__SuperAdminUsername=${SEED_SUPERADMIN_USERNAME:-}
                # Optional: API-key access to /api/analytics/* (MCP server). Empty = admin cookie only.
                - Analytics__ApiKey=${ANALYTICS_API_KEY:-}
              networks:
                - default
                - traefik-public
                - db-internal
              labels:
                - "traefik.enable=true"
                - "traefik.http.routers.kickgateway-api.rule=Host(`${PUBLIC_HOST}`)"
                - "traefik.http.routers.kickgateway-api.entrypoints=websecure"
                - "traefik.http.routers.kickgateway-api.tls=true"
                - "traefik.http.routers.kickgateway-api.tls.certresolver=letsencrypt-dns"
                - "traefik.http.routers.kickgateway-api.tls.domains[0].main=${PUBLIC_HOST}"
                - "traefik.http.services.kickgateway-api.loadbalancer.server.port=8080"
                - "traefik.docker.network=traefik-public"

            worker:
              image: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-worker:${IMAGE_TAG:-latest}
              restart: unless-stopped
              depends_on:
                - api
              environment:
                - DOTNET_ENVIRONMENT=Production
                - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
                - RabbitMq__Port=${RABBITMQ_PORT:-5672}
                - RabbitMq__VirtualHost=${RABBITMQ_VHOST:-/}
                - RabbitMq__Username=${RABBITMQ_USERNAME:-}
                - RabbitMq__Password=${RABBITMQ_PASSWORD:-}
              networks:
                - default
                - traefik-public

            realtime:
              image: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-realtime:${IMAGE_TAG:-latest}
              restart: unless-stopped
              depends_on:
                - api
              environment:
                - DOTNET_ENVIRONMENT=Production
                - ConnectionStrings__KickGateway=${DB_CONNECTION_STRING:-}
                - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
                - RabbitMq__Port=${RABBITMQ_PORT:-5672}
                - RabbitMq__VirtualHost=${RABBITMQ_VHOST:-/}
                - RabbitMq__Username=${RABBITMQ_USERNAME:-}
                - RabbitMq__Password=${RABBITMQ_PASSWORD:-}
                # Sidecar: used to resolve each slug's channel_id/chatroom_id past Cloudflare.
                - Kick__ClipsFetcherUrl=http://clips-fetcher:8080
                - Kick__ClipsFetcherSecret=${CLIPS_FETCHER_SECRET:-}
                # Live-video capture is opt-in — set REALTIME_VIDEO_ENABLED=true to turn it on.
                - Kick__Realtime__Video__Enabled=${REALTIME_VIDEO_ENABLED:-false}
                # Highest rendition under this cap is captured (audio for the transcriber + the subtitles relay).
                - Kick__Realtime__Video__MaxBitrateKbps=${REALTIME_VIDEO_MAX_BITRATE_KBPS:-1500}
              networks:
                - default
                - traefik-public
                - db-internal

            # Chat-analytics MCP server (Streamable HTTP) at https://${PUBLIC_HOST}/mcp. A thin adapter: it calls
            # the api over the internal network with the analytics key, and clients authenticate with the same key.
            mcp:
              image: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-mcp:${IMAGE_TAG:-latest}
              restart: unless-stopped
              depends_on:
                - api
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - Mcp__Transport=http
                - KickGateway__BaseUrl=http://api:8080
                - KickGateway__ApiKey=${ANALYTICS_API_KEY:-}
              networks:
                - default
                - traefik-public
              labels:
                - "traefik.enable=true"
                - "traefik.http.routers.kickgateway-mcp.rule=Host(`${PUBLIC_HOST}`) && PathPrefix(`/mcp`)"
                - "traefik.http.routers.kickgateway-mcp.priority=100"
                - "traefik.http.routers.kickgateway-mcp.entrypoints=websecure"
                - "traefik.http.routers.kickgateway-mcp.tls=true"
                - "traefik.http.routers.kickgateway-mcp.tls.certresolver=letsencrypt-dns"
                - "traefik.http.routers.kickgateway-mcp.tls.domains[0].main=${PUBLIC_HOST}"
                - "traefik.http.services.kickgateway-mcp.loadbalancer.server.port=8080"
                - "traefik.docker.network=traefik-public"

            # Live-subtitles site (OPT-IN via SUBTITLES_ENABLED + SUBTITLES_HOST): https://${SUBTITLES_HOST}/{slug}
            # embeds Kick's own player and overlays the channel's LiveTranscript stream as captions (SSE).
            # Video never flows through the VPS (Kick's CDN only serves browsers from kick.com origins, so the
            # iframe is the only option anyway); this container only relays text. Separate hostname → its
            # own Traefik router + certificate. SUBTITLES_CHANNELS (comma-separated slugs) limits the pages
            # served and the transcripts received; empty = any channel.
            subtitles:
              image: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-subtitles:${IMAGE_TAG:-latest}
              profiles: ["subtitles"]
              restart: unless-stopped
              environment:
                - ASPNETCORE_ENVIRONMENT=Production
                - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
                - RabbitMq__Port=${RABBITMQ_PORT:-5672}
                - RabbitMq__VirtualHost=${RABBITMQ_VHOST:-/}
                - RabbitMq__Username=${RABBITMQ_USERNAME:-}
                - RabbitMq__Password=${RABBITMQ_PASSWORD:-}
                - Subtitles__Channels=${SUBTITLES_CHANNELS:-}
                # Delayed player (token-gated relay of the captured segments). Empty token = relay off.
                - Subtitles__Relay__Token=${SUBTITLES_RELAY_TOKEN:-}
                - Subtitles__Relay__MaxViewersPerChannel=${SUBTITLES_RELAY_MAX_VIEWERS:-3}
              networks:
                - default
                - traefik-public
              labels:
                - "traefik.enable=true"
                - "traefik.http.routers.kickgateway-subtitles.rule=Host(`${SUBTITLES_HOST}`)"
                - "traefik.http.routers.kickgateway-subtitles.entrypoints=websecure"
                - "traefik.http.routers.kickgateway-subtitles.tls=true"
                - "traefik.http.routers.kickgateway-subtitles.tls.certresolver=letsencrypt-dns"
                - "traefik.http.routers.kickgateway-subtitles.tls.domains[0].main=${SUBTITLES_HOST}"
                - "traefik.http.services.kickgateway-subtitles.loadbalancer.server.port=8080"
                - "traefik.docker.network=traefik-public"

            # Translator (OPT-IN via TRANSLATOR_ENABLED): LiveTranscript slices in the configured source languages
            # (default German) are translated into TRANSLATOR_TARGET_LANGUAGE (default Polish) and published as
            # LiveTranscriptTranslation - stored by the api next to the transcript and shown by the subtitles site.
            # Provider: deepl (default; free plan = 500k chars/month, key ends with :fx), openai (any
            # /chat/completions endpoint - a local Ollama needs no key) or anthropic. One call per slice
            # (~10-15 s of speech); slices below the confidence floor or older than two minutes are skipped.
            translator:
              image: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-translator:${IMAGE_TAG:-latest}
              profiles: ["translator"]
              restart: unless-stopped
              environment:
                - DOTNET_ENVIRONMENT=Production
                - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
                - RabbitMq__Port=${RABBITMQ_PORT:-5672}
                - RabbitMq__VirtualHost=${RABBITMQ_VHOST:-/}
                - RabbitMq__Username=${RABBITMQ_USERNAME:-}
                - RabbitMq__Password=${RABBITMQ_PASSWORD:-}
                - Translator__SourceLanguages=${TRANSLATOR_SOURCE_LANGUAGES:-de}
                - Translator__TargetLanguage=${TRANSLATOR_TARGET_LANGUAGE:-pl}
                - Translator__Channels=${TRANSLATOR_CHANNELS:-}
                - Translator__Provider__Name=${TRANSLATOR_PROVIDER:-deepl}
                - Translator__Provider__ApiKey=${TRANSLATOR_API_KEY:-}
                - Translator__Provider__Model=${TRANSLATOR_MODEL:-}
                - Translator__Provider__BaseUrl=${TRANSLATOR_BASE_URL:-}
                - Translator__Provider__Formality=${TRANSLATOR_FORMALITY:-prefer_less}
              networks:
                - default

            # Live speech-to-text, CPU only (no GPU on the VPS), OPT-IN. Consumes LiveVideoSegment - so it only
            # works while REALTIME_VIDEO_ENABLED=true and a channel is live - and publishes LiveTranscript,
            # which the api stores in LiveTranscripts. Default model LargeV3Turbo (best Polish quality; the
            # VPS has plenty of cores) - if the logs show 'slower than real time' / dropped chunks, set
            # TRANSCRIBER_MODEL=Small (~6x cheaper). The GGML model is downloaded from Hugging Face on
            # first start into the models volume. cpu_shares keeps Whisper below the api under contention.
            transcriber:
              image: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-transcriber:${IMAGE_TAG:-latest}
              # Opt-in via the TRANSCRIBER_ENABLED repo variable (-> COMPOSE_PROFILES in .env). Off by
              # default: run exactly ONE transcriber per channel (e.g. on a GPU box publishing to this
              # broker) - two producers would store every sentence twice (DedupeKey is per process).
              profiles: ["transcriber"]
              restart: unless-stopped
              depends_on:
                - api
              cpu_shares: 512
              environment:
                - DOTNET_ENVIRONMENT=Production
                - RabbitMq__Host=${RABBITMQ_HOST:-rabbitmq}
                - RabbitMq__Port=${RABBITMQ_PORT:-5672}
                - RabbitMq__VirtualHost=${RABBITMQ_VHOST:-/}
                - RabbitMq__Username=${RABBITMQ_USERNAME:-}
                - RabbitMq__Password=${RABBITMQ_PASSWORD:-}
                - Transcriber__UseGpu=false
                - Transcriber__Model=${TRANSCRIBER_MODEL:-LargeV3Turbo}
                - Transcriber__Quantization=${TRANSCRIBER_QUANTIZATION:-Q5_0}
                - Transcriber__Language=${TRANSCRIBER_LANGUAGE:-pl}
                - Transcriber__Languages=${TRANSCRIBER_LANGUAGES-pl,en,de}
                - Transcriber__LanguageSwitchMinProbability=${TRANSCRIBER_LANGUAGE_MIN_PROBABILITY:-0.7}
                - Transcriber__LanguageSwitchConfirmChunks=${TRANSCRIBER_LANGUAGE_CONFIRM_CHUNKS:-2}
                - Transcriber__Threads=${TRANSCRIBER_THREADS:-0}
                - Transcriber__WriteFiles=${TRANSCRIBER_WRITE_FILES:-false}
                - Transcriber__ModelDir=/models
                - Transcriber__OutputDir=/transcripts
              volumes:
                - transcriber-models:/models
                - transcriber-transcripts:/transcripts
              networks:
                - default
                - traefik-public

            clips-fetcher:
              image: ${{ vars.DOCKERHUB_NAMESPACE }}/kickgateway-clips-fetcher:${IMAGE_TAG:-latest}
              restart: unless-stopped
              environment:
                - FETCH_SECRET=${CLIPS_FETCHER_SECRET:-}
              networks:
                - default
          volumes:
            transcriber-models:
            transcriber-transcripts:
          COMPOSE

          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            /tmp/docker-compose.prod.yml \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/apps/kickgateway/docker-compose.yml

          # Opt-in compose profiles (comma-separated when several are on).
          PROFILES=""
          [ "${{ vars.TRANSCRIBER_ENABLED }}" = "true" ] && PROFILES="transcriber"
          [ "${{ vars.SUBTITLES_ENABLED }}" = "true" ] && PROFILES="${PROFILES:+$PROFILES,}subtitles"
          [ "${{ vars.TRANSLATOR_ENABLED }}" = "true" ] && PROFILES="${PROFILES:+$PROFILES,}translator"

          # Write .env with secrets
          $SSH_CMD "cat > /opt/apps/kickgateway/.env << 'ENVFILE'
          IMAGE_TAG=${{ github.sha }}
          DB_CONNECTION_STRING=${{ secrets.DB_CONNECTION_STRING }}
          RABBITMQ_HOST=${{ secrets.RABBITMQ_HOST }}
          RABBITMQ_PORT=${{ secrets.RABBITMQ_PORT }}
          RABBITMQ_VHOST=${{ secrets.RABBITMQ_VHOST }}
          RABBITMQ_USERNAME=${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD=${{ secrets.RABBITMQ_PASSWORD }}
          KICK_WEBHOOK_URL=${{ secrets.KICK_WEBHOOK_URL }}
          SEED_SUPERADMIN_USERNAME=${{ secrets.SEED_SUPERADMIN_USERNAME }}
          PUBLIC_HOST=${{ secrets.PUBLIC_HOST }}
          CLIPS_FETCHER_SECRET=${{ secrets.CLIPS_FETCHER_SECRET }}
          ANALYTICS_API_KEY=${{ secrets.ANALYTICS_API_KEY }}
          REALTIME_VIDEO_ENABLED=${{ vars.REALTIME_VIDEO_ENABLED }}
          COMPOSE_PROFILES=$PROFILES
          SUBTITLES_HOST=${{ secrets.SUBTITLES_HOST }}
          SUBTITLES_CHANNELS=${{ vars.SUBTITLES_CHANNELS }}
          SUBTITLES_RELAY_TOKEN=${{ secrets.SUBTITLES_RELAY_TOKEN }}
          SUBTITLES_RELAY_MAX_VIEWERS=${{ vars.SUBTITLES_RELAY_MAX_VIEWERS }}
          REALTIME_VIDEO_MAX_BITRATE_KBPS=${{ vars.REALTIME_VIDEO_MAX_BITRATE_KBPS }}
          TRANSLATOR_API_KEY=${{ secrets.TRANSLATOR_API_KEY }}
          TRANSLATOR_PROVIDER=${{ vars.TRANSLATOR_PROVIDER }}
          TRANSLATOR_MODEL=${{ vars.TRANSLATOR_MODEL }}
          TRANSLATOR_BASE_URL=${{ vars.TRANSLATOR_BASE_URL }}
          TRANSLATOR_FORMALITY=${{ vars.TRANSLATOR_FORMALITY }}
          TRANSLATOR_SOURCE_LANGUAGES=${{ vars.TRANSLATOR_SOURCE_LANGUAGES }}
          TRANSLATOR_TARGET_LANGUAGE=${{ vars.TRANSLATOR_TARGET_LANGUAGE }}
          TRANSLATOR_CHANNELS=${{ vars.TRANSLATOR_CHANNELS }}
          TRANSCRIBER_MODEL=${{ vars.TRANSCRIBER_MODEL }}
          TRANSCRIBER_QUANTIZATION=${{ vars.TRANSCRIBER_QUANTIZATION }}
          TRANSCRIBER_LANGUAGE=${{ vars.TRANSCRIBER_LANGUAGE }}
          TRANSCRIBER_LANGUAGES=${{ vars.TRANSCRIBER_LANGUAGES || 'pl,en,de' }}
          TRANSCRIBER_LANGUAGE_MIN_PROBABILITY=${{ vars.TRANSCRIBER_LANGUAGE_MIN_PROBABILITY }}
          TRANSCRIBER_LANGUAGE_CONFIRM_CHUNKS=${{ vars.TRANSCRIBER_LANGUAGE_CONFIRM_CHUNKS }}
          TRANSCRIBER_THREADS=${{ vars.TRANSCRIBER_THREADS }}
          TRANSCRIBER_WRITE_FILES=${{ vars.TRANSCRIBER_WRITE_FILES }}
          ENVFILE"

          # Ensure shared external networks exist (idempotent).
          $SSH_CMD "docker network create traefik-public 2>/dev/null || true"
          $SSH_CMD "docker network create db-internal 2>/dev/null || true"

          # Docker login on server (for private images, if Docker Hub repo is private)
          $SSH_CMD "docker login -u ${{ secrets.DOCKERHUB_USER }} -p ${{ secrets.DOCKERHUB_TOKEN }}"

          # Pull and deploy
          $SSH_CMD "cd /opt/apps/kickgateway && docker compose pull && docker compose up -d --remove-orphans"

          # `up` ignores services of inactive profiles even if their container is running, so turn the
          # transcriber off explicitly when TRANSCRIBER_ENABLED is not 'true'.
          if [ "${{ vars.TRANSCRIBER_ENABLED }}" != "true" ]; then
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile transcriber rm -s -f transcriber >/dev/null 2>&1 || true"
          fi
          if [ "${{ vars.SUBTITLES_ENABLED }}" != "true" ]; then
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile subtitles rm -s -f subtitles >/dev/null 2>&1 || true"
          fi
          if [ "${{ vars.TRANSLATOR_ENABLED }}" != "true" ]; then
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile translator rm -s -f translator >/dev/null 2>&1 || true"
          fi

          # Verify
          $SSH_CMD "cd /opt/apps/kickgateway && docker compose ps"

      - name: Health check
        env:
          PUBLIC_HOST: ${{ secrets.PUBLIC_HOST }}
        run: |
          sleep 20
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"

          echo "── docker compose ps ──"
          $SSH_CMD "cd /opt/apps/kickgateway && docker compose ps"

          echo "── unhealthy/restarting containers (any?) ──"
          UNHEALTHY=$($SSH_CMD "cd /opt/apps/kickgateway && docker compose ps --format '{{.Name}} {{.Status}}' | grep -E 'unhealthy|Restarting|Exited' || true")
          if [ -n "$UNHEALTHY" ]; then
            echo "❌ Unhealthy containers found:"
            echo "$UNHEALTHY"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose --profile transcriber logs --tail 30 api worker transcriber 2>/dev/null || docker compose logs --tail 30 api worker"
            exit 1
          fi

          echo "── HTTPS smoke (admin root) ──"
          STATUS=$(curl -ks -o /dev/null -w "%{http_code}" "https://${PUBLIC_HOST}/")
          echo "https://${PUBLIC_HOST}/ -> HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "❌ Admin root did not return 200/302, dumping api logs:"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose logs --tail 30 api"
            exit 1
          fi

          echo "── Health endpoint ──"
          HEALTH=$(curl -ks -o /dev/null -w "%{http_code}" "https://${PUBLIC_HOST}/health")
          echo "https://${PUBLIC_HOST}/health -> HTTP $HEALTH"
          # /health only exposed in Development per service defaults — accept 200 or 404.
          if [ "$HEALTH" != "200" ] && [ "$HEALTH" != "404" ]; then
            echo "⚠️ Unexpected /health status — investigate"
          fi

          echo "── Admin UI ──"
          ADMIN=$(curl -ks -o /dev/null -w "%{http_code}" "https://${PUBLIC_HOST}/admin")
          echo "https://${PUBLIC_HOST}/admin -> HTTP $ADMIN"
          if [ "$ADMIN" != "200" ]; then
            echo "❌ /admin did not return 200"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose logs --tail 30 api"
            exit 1
          fi

          echo "── Webhook endpoint (expects 400/401 without proper signature, NOT 5xx) ──"
          WH=$(curl -ks -o /dev/null -w "%{http_code}" -X POST "https://${PUBLIC_HOST}/api/webhooks/kick" -H "Content-Type: application/json" -d '{}')
          echo "POST /api/webhooks/kick (empty) -> HTTP $WH"
          if [ "$WH" = "500" ] || [ "$WH" = "502" ] || [ "$WH" = "503" ] || [ "$WH" = "504" ]; then
            echo "❌ Webhook endpoint returning 5xx — pipeline crash"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose logs --tail 30 api"
            exit 1
          fi

          echo "── OBS clips API (unknown channel → expect 404, NOT 5xx) ──"
          OBS=$(curl -ks -o /dev/null -w "%{http_code}" "https://${PUBLIC_HOST}/api/obs/clips/__deploy_probe__")
          echo "GET /api/obs/clips/__deploy_probe__ -> HTTP $OBS"
          if [ "$OBS" = "500" ] || [ "$OBS" = "502" ] || [ "$OBS" = "503" ] || [ "$OBS" = "504" ]; then
            echo "❌ OBS clips endpoint returning 5xx"
            $SSH_CMD "cd /opt/apps/kickgateway && docker compose logs --tail 30 api clips-fetcher"
            exit 1
          fi

          echo "✅ All smoke tests passed"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
